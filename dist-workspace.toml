[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.30.2"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# Allow custom modifications to the CI workflow
allow-dirty = ["ci"]

# Apple Silicon is cross-compiled on the Intel runner. GitHub retired the
# macos-14 image dist 0.30.2 picks (v0.4.1 cancelled), and its arm64 pool
# was out of capacity for every v0.4.2 attempt ("not acquired by Runner
# ... capacity constraints"). Xcode on Intel links arm64 fine, and the
# bundle job lipo's both into a universal binary and checks it.
[dist.github-custom-runners]
aarch64-apple-darwin = "macos-15-intel"
