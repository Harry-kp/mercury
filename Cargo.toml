[package]
name = "mercury"
version = "0.4.1"
edition = "2021"
description = "A fast, minimal API client for developers"
authors = ["Harshit Chaudhary <harrykumar.kp@gmail.com>"]
license = "MIT"
repository = "https://github.com/Harry-kp/mercury"
homepage = "https://github.com/Harry-kp/mercury"
keywords = ["api", "rest", "http", "client", "developer-tools"]
categories = ["development-tools", "network-programming"]

[dependencies]
eframe = { version = "0.33", default-features = false, features = ["glow", "default_fonts", "accesskit"] }
# rustls on `ring` instead of the default aws-lc-rs: the same TLS stack
# (OS trust store via rustls-platform-verifier) at a fraction of the size.
# `json` is unused (bodies go through serde_json directly).
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "charset", "http2", "system-proxy", "blocking", "cookies", "gzip", "brotli", "deflate"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
serde_yaml = "0.9"
dirs = "6"
rfd = "0.17"
image = { version = "0.25", default-features = false, features = ["png"] }
open = "5"
notify-debouncer-mini = "0.7"
base64 = "0.22.1"

[dev-dependencies]
tempfile = "3"
egui_kittest = "0.33"

# Release optimizations
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# The profile that 'dist' will build with (what users download). It used to
# override `lto = "thin"`, shipping a binary ~1 MB larger than release.
[profile.dist]
inherits = "release"

# Bundle configuration for cargo-bundle
[package.metadata.bundle]
name = "Mercury"
identifier = "com.mercury.app"
icon = ["assets/icons/icon.icns"]
category = "Developer Tool"
short_description = "A fast, minimal API client"
long_description = """
Mercury is a fast, minimal API client for developers who value simplicity.
Built with Rust for native performance. No bloat, no subscriptions, no nonsense.
"""
copyright = "Copyright (c) 2024 Harshit Chaudhary. MIT License."

# cargo-bundle 0.10 moved the macOS keys into their own table and rejects
# unknown fields, so the old flat `osx_minimum_system_version` fails the build.
[package.metadata.bundle.osx]
minimum_system_version = "12.0"
